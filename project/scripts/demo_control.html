<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>妙手通言控制台</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",sans-serif;background:#0c1422;color:#e8eff9}*{box-sizing:border-box}body{max-width:1500px;margin:auto;padding:32px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:30px;margin:5px 0}p{color:#9cadc5;line-height:1.7}.eyebrow{color:#5ee4cb;letter-spacing:3px;font-size:12px}.badge{border:1px solid #34445e;border-radius:30px;padding:8px 14px;color:#93a6c2;font-size:13px}.badge.ok{color:#5ee4cb;border-color:#2d7467}main{display:grid;grid-template-columns:380px 1fr;gap:24px}.card{background:#141f31;border:1px solid #26344b;border-radius:18px;padding:20px}.modes{display:grid;gap:12px}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #34445e;background:#19283e;border-radius:12px;padding:16px;text-align:left;transition:.15s}button:hover{background:#223852;border-color:#6a8ea9}button.active{background:#183b3b;border-color:#5ee4cb}button:disabled{opacity:.5;cursor:wait}button strong{display:block;font-size:17px;margin-bottom:0}button small{display:block;color:#a0b3cb;line-height:1.6}.number{color:#5ee4cb;margin-right:8px}select{background:#0d1728;color:white;border:1px solid #3b506f;padding:8px;border-radius:8px}label{font-size:13px;color:#a0b3cb}.row{display:flex;gap:12px;align-items:center;margin-top:14px}.stop{background:#3c232b;border-color:#78404c;text-align:center;width:100%;margin-top:18px}.preview{width:100%;aspect-ratio:16/9;background:#080e17;border-radius:12px;object-fit:contain;display:none}.empty{aspect-ratio:16/9;display:grid;place-items:center;background:#080e17;border-radius:12px;color:#8194b0}.statusline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.statusline h2{margin:0;font-size:20px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.metric{background:#0e1828;border-radius:10px;padding:14px}.metric span{display:block;color:#879bb6;font-size:12px}.metric b{display:block;font-size:23px;margin-top:8px;font-weight:500}.notice{border-left:3px solid #4bb7a8;padding-left:12px;font-size:13px}.error{white-space:pre-wrap;overflow-wrap:anywhere;background:#3c222a;border:1px solid #804455;padding:14px;border-radius:10px;display:none;color:#ffd0d0}details{margin-top:20px;color:#99abc3;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}a{color:#7edbce}.footer{font-size:12px;margin-top:20px;color:#7d91ad}@media(max-width:950px){main{grid-template-columns:1fr}body{padding:16px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
<header><div><div class="eyebrow">妙手通言 / CONSOLE</div><h1>妙手通言控制台</h1></div><span id="connection" class="badge">连接中</span></header>
<main><aside><div class="card"><div class="modes">
<button data-mode="av"><strong><span class="number">启动</span>视听HDMI三栏</strong></button>
<button data-mode="camera"><strong>电脑USB摄像头识别叠加</strong></button>
<div class="row"><label for="camera">USB摄像头编号</label><select id="camera"><option value="0">0（默认）</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
<button data-mode="sd_teacher"><strong>SD高动态教学视频实时处理</strong></button>
</div>
<button class="stop" data-mode="idle">停止采集与识别</button></div></aside>
<section><div class="card"><div class="statusline"><h2 id="title">正在读取状态</h2><span id="activity" class="badge">待机</span></div><p id="message">正在连接…</p><div id="error" class="error" role="alert"></div>
<img id="preview" class="preview" alt="当前 HDMI 画面预览"><div id="empty" class="empty">等待画面预览</div>
<div id="signPanel" hidden><p style="margin-bottom:4px">手语识别结果</p><div id="signLabel" style="font-size:32px;color:#5ee4cb">等待动作</div><p id="signCandidate"></p><p class="notice">演示词：谢谢、再见、没关系、可以、早上。请完整做一个动作，停顿后再做下一个。候选分数不是准确率或概率。</p></div>
<div class="metrics"><div class="metric"><span>原始画面帧</span><b id="frames">—</b></div><div class="metric"><span>教师处理帧数</span><b id="results">—</b></div><div class="metric"><span>教师处理速率</span><b id="hz">—</b></div><div class="metric"><span>教师单帧耗时</span><b id="latency">—</b></div><div class="metric"><span>教师来源帧</span><b id="age">—</b></div><div class="metric"><span>预览更新时间</span><b id="fresh">—</b></div></div>
<div id="audioLinks" hidden><a href="http://127.0.0.1:8765" target="_blank" rel="noopener">打开语音详细界面 ↗</a>　<a href="/api/sentences" id="sentencesLink" hidden>台词</a><p>试读：早上好，你好吗？很好，谢谢。</p><p id="transcript"></p></div>
<details><summary>运行详情与诊断</summary><pre id="details"></pre></details></div></section></main>
<script>
const token='__SESSION__';let pending=false,lastImage=0,polling=false,serverBusy=false,sessionToken=token,requestFailure='';const $=id=>document.getElementById(id);
async function fetchText(url,options={}){
 const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),6000);
 try{const response=await fetch(url,{...options,cache:'no-store',signal:abort.signal});return {ok:response.ok,status:response.status,text:await response.text()}}
 finally{clearTimeout(timer)}
}
function requestError(e){if(e.name==='AbortError')return '请求超时，请查看当前状态后重试。';return /failed to fetch|networkerror|load failed/i.test(e.message||'')?'控制服务未连接，请检查服务后重试。':e.message}
async function switchMode(mode){
 if(pending)return;pending=true;requestFailure='';lock(true);showError('');$('message').textContent='正在提交切换…';$('activity').textContent='切换中';
 const body=JSON.stringify({mode,camera:Number($('camera').value),cold_boot:true});
 const send=()=>fetchText('/api/switch',{method:'POST',headers:{'X-Session':sessionToken,'Content-Type':'application/json'},body});
 try{
  let reply=await send();
  if(reply.status===403){
   const page=await fetchText('/'),match=page.ok&&page.text.match(/const token='([^']+)'/);
   if(!match)throw Error('无法更新页面会话，请刷新本页。');
   sessionToken=match[1];reply=await send();
  }
  if(reply.status===403)throw Error('页面会话已更新，请刷新本页。');
  const data=JSON.parse(reply.text);if(!reply.ok)throw Error(data.error||'切换未成功');serverBusy=true;
 }catch(e){requestFailure=requestError(e);showError(requestFailure)}
 finally{pending=false;lock(serverBusy);void poll()}
}
function lock(value){document.querySelectorAll('button').forEach(b=>b.disabled=value)}
function showError(text){$('error').textContent=text;$('error').style.display=text?'block':'none'}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));
async function poll(){if(polling)return;polling=true;try{let r=await fetchText('/api/state');if(!r.ok)throw Error('控制服务状态不可用');let s=JSON.parse(r.text),d=s.details||{},last=d.last_result||{};serverBusy=!!s.busy;
let sign=d.sign_recognition;$('signPanel').hidden=!sign;
if(sign){$('signLabel').textContent=sign.label||'未确定';$('signCandidate').textContent=(sign.candidate?'候选：'+sign.candidate+'；':'')+(sign.reason||'')+'（实验识别，尚未完成摄像头精度验收）'}
lock(s.busy||pending);$('title').textContent=s.title;$('message').textContent=s.message;$('activity').textContent=s.busy?'正在启动':s.mode==='idle'?'待机':'运行中';$('connection').textContent=s.connected?'板卡已连接':'板卡未连接';$('connection').classList.toggle('ok',s.connected);document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===s.mode));showError(s.error||d.error||requestFailure||'');$('frames').textContent=(d.display||{}).raw_source_frame??d.video_frame??'—';$('results').textContent=d.results??'—';let hz=d.result_hz;$('hz').textContent=hz==null?'—':hz.toFixed(2)+' Hz';let ms=d.teacher_ms;$('latency').textContent=ms==null?'—':ms.toFixed(0)+' ms';$('age').textContent=d.video_frame??'—';$('fresh').textContent=s.preview_time?new Date(s.preview_time*1000).toLocaleTimeString():'—';$('details').textContent=JSON.stringify({device:s.device,...d},null,2);$('audioLinks').hidden=s.mode!=='av';$('transcript').textContent=(d.audio||{}).partial||(d.audio||{}).final||'';
if(s.preview_time&&s.preview_time!==lastImage){lastImage=s.preview_time;$('preview').src='/api/preview.jpg?t='+Date.now()}}catch(e){serverBusy=false;$('connection').textContent='控制服务离线';$('connection').classList.remove('ok');showError(requestError(e))}finally{polling=false;lock(pending||serverBusy)} }
$('preview').onload=()=>{$('preview').style.display='block';$('empty').style.display='none'};
poll();setInterval(poll,1500);
</script></html>
